name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish single-file exe
        run: |
          dotnet publish src/Kmz2Mbtiles.Cli/Kmz2Mbtiles.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o publish

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Kmz2Mbtiles-win-x64
          path: |
            publish/Kmz2Mbtiles.exe
            publish/Kmz2Mbtiles.bat
            publish/compare_mbtiles.py
            publish/compare_mbtiles.bat
            publish/e_sqlite3.dll
          if-no-files-found: error

      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dir = "publish\Kmz2Mbtiles-$version-win-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item publish\Kmz2Mbtiles.exe $dir
          Copy-Item publish\Kmz2Mbtiles.bat $dir
          Copy-Item publish\compare_mbtiles.py $dir
          Copy-Item publish\compare_mbtiles.bat $dir
          Copy-Item publish\e_sqlite3.dll $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "publish\Kmz2Mbtiles-$version-win-x64.zip"

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: publish/Kmz2Mbtiles-*-win-x64.zip