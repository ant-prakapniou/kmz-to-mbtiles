name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish single-file exe
        run: |
          dotnet publish src/Kmz2Mbtiles.Cli/Kmz2Mbtiles.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kmz2Mbtiles-win-x64
          path: |
            publish/Kmz2Mbtiles.exe
            publish/Kmz2Mbtiles.bat
            publish/compare_mbtiles.py
            publish/compare_mbtiles.bat
            publish/e_sqlite3.dll
          if-no-files-found: error